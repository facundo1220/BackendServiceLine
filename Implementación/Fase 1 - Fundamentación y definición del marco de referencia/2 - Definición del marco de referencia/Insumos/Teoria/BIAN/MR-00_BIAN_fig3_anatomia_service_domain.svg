<svg width="1120" height="560" viewBox="0 0 1120 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="560" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#2f2f2f">Figura 3. Anatomía de un Service Domain</text>
  <text x="560" y="50" text-anchor="middle" font-size="10.5" fill="#888">Los cuatro elementos que definen su comportamiento, con Consumer Loan como ejemplo</text>

  <!-- Service domain header -->
  <rect x="380" y="74" width="360" height="52" rx="10" fill="#e0f0ee" stroke="#2f6f6b" stroke-width="1.6"/>
  <text x="560" y="97" text-anchor="middle" font-size="13" font-weight="700" fill="#1f4d4a">Service Domain</text>
  <text x="560" y="115" text-anchor="middle" font-size="11" fill="#2f6f6b">Consumer Loan</text>

  <line x1="560" y1="126" x2="560" y2="146" stroke="#999" stroke-width="1.3"/>
  <line x1="150" y1="146" x2="970" y2="146" stroke="#999" stroke-width="1.3"/>
  <line x1="150" y1="146" x2="150" y2="166" stroke="#999" stroke-width="1.3" marker-end="url(#arA)"/>
  <line x1="423" y1="146" x2="423" y2="166" stroke="#999" stroke-width="1.3" marker-end="url(#arA)"/>
  <line x1="697" y1="146" x2="697" y2="166" stroke="#999" stroke-width="1.3" marker-end="url(#arA)"/>
  <line x1="970" y1="146" x2="970" y2="166" stroke="#999" stroke-width="1.3" marker-end="url(#arA)"/>

  <!-- 1 Control record -->
  <rect x="30" y="168" width="240" height="176" rx="10" fill="#efe9f7" stroke="#8a6fb0" stroke-width="1.3"/>
  <text x="150" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#5b4680">Control record</text>
  <line x1="48" y1="202" x2="252" y2="202" stroke="#d8cfe6"/>
  <text x="48" y="222" font-size="10" font-weight="600" fill="#6d5a8c">Qué es</text>
  <text x="48" y="238" font-size="10" fill="#555">El objeto de negocio que</text>
  <text x="48" y="252" font-size="10" fill="#555">el dominio gobierna, de</text>
  <text x="48" y="266" font-size="10" fill="#555">principio a fin del ciclo</text>
  <text x="48" y="290" font-size="10" font-weight="600" fill="#6d5a8c">Ejemplo</text>
  <text x="48" y="306" font-size="10" fill="#555">El préstamo de consumo</text>
  <text x="48" y="330" font-size="9.5" font-style="italic" fill="#8a7aa8">En DDD: agregado raíz</text>

  <!-- 2 Behavior qualifiers -->
  <rect x="303" y="168" width="240" height="176" rx="10" fill="#efe9f7" stroke="#8a6fb0" stroke-width="1.3"/>
  <text x="423" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#5b4680">Behavior qualifiers</text>
  <line x1="321" y1="202" x2="525" y2="202" stroke="#d8cfe6"/>
  <text x="321" y="222" font-size="10" font-weight="600" fill="#6d5a8c">Qué es</text>
  <text x="321" y="238" font-size="10" fill="#555">Descomposición del</text>
  <text x="321" y="252" font-size="10" fill="#555">control record en partes</text>
  <text x="321" y="266" font-size="10" fill="#555">y subpartes</text>
  <text x="321" y="290" font-size="10" font-weight="600" fill="#6d5a8c">Ejemplo</text>
  <text x="321" y="306" font-size="10" fill="#555">Cuotas, garantías, plan de</text>
  <text x="321" y="320" font-size="10" fill="#555">pagos del préstamo</text>
  <text x="321" y="336" font-size="9.5" font-style="italic" fill="#8a7aa8">En DDD: entidades y VO internos</text>

  <!-- 3 Functional pattern -->
  <rect x="577" y="168" width="240" height="176" rx="10" fill="#f4f4f4" stroke="#999" stroke-width="1.3"/>
  <text x="697" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#555">Functional pattern</text>
  <line x1="595" y1="202" x2="799" y2="202" stroke="#ddd"/>
  <text x="595" y="222" font-size="10" font-weight="600" fill="#666">Qué es</text>
  <text x="595" y="238" font-size="10" fill="#555">Patrón cerrado que define</text>
  <text x="595" y="252" font-size="10" fill="#555">cómo se comporta. Cada uno</text>
  <text x="595" y="266" font-size="10" fill="#555">trae un artefacto genérico</text>
  <text x="595" y="290" font-size="10" font-weight="600" fill="#666">Ejemplos de patrón</text>
  <text x="595" y="306" font-size="10" fill="#555">Fulfill → Arrangement</text>
  <text x="595" y="320" font-size="10" fill="#555">Transact → Transaction</text>
  <text x="595" y="334" font-size="10" fill="#555">Catalog → Directory Entry</text>

  <!-- 4 Service operations -->
  <rect x="850" y="168" width="240" height="176" rx="10" fill="#f4f4f4" stroke="#999" stroke-width="1.3"/>
  <text x="970" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#555">Service operations</text>
  <line x1="868" y1="202" x2="1072" y2="202" stroke="#ddd"/>
  <text x="868" y="222" font-size="10" font-weight="600" fill="#666">Qué es</text>
  <text x="868" y="238" font-size="10" fill="#555">Operaciones con verbos</text>
  <text x="868" y="252" font-size="10" fill="#555">normalizados de la industria</text>
  <text x="868" y="276" font-size="10" font-weight="600" fill="#666">Verbos</text>
  <text x="868" y="292" font-size="10" fill="#555">Initiate · Create · Register</text>
  <text x="868" y="306" font-size="10" fill="#555">Update · Retrieve · Execute</text>
  <text x="868" y="320" font-size="10" fill="#555">Evaluate · Notify · Control</text>
  <text x="868" y="336" font-size="9.5" font-style="italic" fill="#999">Orienta nombres de la API</text>

  <!-- bottom layer: semantic API + BOM -->
  <rect x="30" y="366" width="530" height="88" rx="10" fill="#fafafa" stroke="#ccc"/>
  <text x="295" y="390" text-anchor="middle" font-size="11.5" font-weight="700" fill="#555">Semantic API</text>
  <text x="295" y="410" text-anchor="middle" font-size="10" fill="#666">Interfaz que expone las service operations del dominio</text>
  <text x="295" y="430" text-anchor="middle" font-size="10" fill="#999">No aplica a este trabajo: es especificación de negocio concreta</text>

  <rect x="580" y="366" width="510" height="88" rx="10" fill="#fafafa" stroke="#ccc"/>
  <text x="835" y="390" text-anchor="middle" font-size="11.5" font-weight="700" fill="#555">Business Object Model</text>
  <text x="835" y="410" text-anchor="middle" font-size="10" fill="#666">Vocabulario común: Party, Product, Payment, Facility, Collateral</text>
  <text x="835" y="430" text-anchor="middle" font-size="10" fill="#999">No aplica a este trabajo: es modelo de datos de negocio</text>

  <!-- key property -->
  <rect x="30" y="472" width="1060" height="62" rx="10" fill="#f5fbfa" stroke="#2f6f6b" stroke-width="1.3"/>
  <text x="560" y="495" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f4d4a">Propiedad que fundamenta la unidad de derivación</text>
  <text x="560" y="514" text-anchor="middle" font-size="10.5" fill="#1f4d4a">Los Service Domains definen capacidades discretas y no solapadas, por lo que la información que gobiernan</text>
  <text x="560" y="528" text-anchor="middle" font-size="10.5" fill="#1f4d4a">también es discreta y no solapada: dos proyectos no pueden ser dueños de la misma cosa</text>
</svg>
