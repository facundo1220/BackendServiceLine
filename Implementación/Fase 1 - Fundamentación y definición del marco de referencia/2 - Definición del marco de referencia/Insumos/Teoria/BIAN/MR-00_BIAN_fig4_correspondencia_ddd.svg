<svg width="1040" height="700" viewBox="0 0 1040 700" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <text x="520" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#2f2f2f">Figura 4. Correspondencia entre BIAN y Domain-Driven Design</text>
  <text x="520" y="50" text-anchor="middle" font-size="10.5" fill="#888">Tres niveles de correspondencia, y lo que queda fuera del alcance de este trabajo</text>

  <text x="215" y="76" text-anchor="middle" font-size="12" font-weight="700" fill="#555">BIAN</text>
  <text x="825" y="76" text-anchor="middle" font-size="12" font-weight="700" fill="#555">Domain-Driven Design</text>

  <!-- Band 1: directa -->
  <rect x="25" y="86" width="990" height="202" rx="10" fill="#f5fbfa" stroke="#2f6f6b" stroke-width="1.3"/>
  <text x="45" y="108" font-size="11.5" font-weight="700" fill="#1f4d4a">Correspondencia directa</text>
  <text x="995" y="108" text-anchor="end" font-size="10" fill="#3a7d78">Fundamenta decisiones del marco</text>

  <rect x="55" y="120" width="320" height="44" rx="7" fill="#ffffff" stroke="#7fb3af"/>
  <text x="215" y="147" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f4d4a">Service Domain</text>
  <line x1="379" y1="142" x2="661" y2="142" stroke="#7fb3af" stroke-width="1.2"/>
  <rect x="665" y="120" width="320" height="44" rx="7" fill="#ffffff" stroke="#7fb3af"/>
  <text x="825" y="147" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f4d4a">Bounded context</text>

  <rect x="55" y="176" width="320" height="44" rx="7" fill="#ffffff" stroke="#7fb3af"/>
  <text x="215" y="203" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f4d4a">Alcance elemental</text>
  <line x1="379" y1="198" x2="661" y2="198" stroke="#7fb3af" stroke-width="1.2"/>
  <rect x="665" y="176" width="320" height="44" rx="7" fill="#ffffff" stroke="#7fb3af"/>
  <text x="825" y="203" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f4d4a">Criterio de granularidad del contexto</text>

  <rect x="55" y="232" width="320" height="44" rx="7" fill="#ffffff" stroke="#7fb3af"/>
  <text x="215" y="259" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f4d4a">No solapamiento entre dominios</text>
  <line x1="379" y1="254" x2="661" y2="254" stroke="#7fb3af" stroke-width="1.2"/>
  <rect x="665" y="232" width="320" height="44" rx="7" fill="#ffffff" stroke="#7fb3af"/>
  <text x="825" y="259" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f4d4a">Frontera de responsabilidad</text>

  <!-- Band 2: analógica -->
  <rect x="25" y="300" width="990" height="146" rx="10" fill="#faf8fd" stroke="#8a6fb0" stroke-width="1.3"/>
  <text x="45" y="322" font-size="11.5" font-weight="700" fill="#5b4680">Correspondencia analógica</text>
  <text x="995" y="322" text-anchor="end" font-size="10" fill="#7a6a99">Guía de nomenclatura, no regla</text>

  <rect x="55" y="334" width="320" height="44" rx="7" fill="#ffffff" stroke="#b9a6d4"/>
  <text x="215" y="361" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5b4680">Control record</text>
  <line x1="379" y1="356" x2="661" y2="356" stroke="#b9a6d4" stroke-width="1.2" stroke-dasharray="5 4"/>
  <rect x="665" y="334" width="320" height="44" rx="7" fill="#ffffff" stroke="#b9a6d4"/>
  <text x="825" y="361" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5b4680">Agregado raíz</text>

  <rect x="55" y="390" width="320" height="44" rx="7" fill="#ffffff" stroke="#b9a6d4"/>
  <text x="215" y="417" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5b4680">Behavior qualifiers</text>
  <line x1="379" y1="412" x2="661" y2="412" stroke="#b9a6d4" stroke-width="1.2" stroke-dasharray="5 4"/>
  <rect x="665" y="390" width="320" height="44" rx="7" fill="#ffffff" stroke="#b9a6d4"/>
  <text x="825" y="417" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5b4680">Entidades y objetos de valor internos</text>

  <!-- Band 3: orientativa -->
  <rect x="25" y="458" width="990" height="90" rx="10" fill="#f7f7f7" stroke="#aaa" stroke-width="1.2"/>
  <text x="45" y="480" font-size="11.5" font-weight="700" fill="#555">Correspondencia orientativa</text>
  <text x="995" y="480" text-anchor="end" font-size="10" fill="#888">Aporta verbos, no especificación</text>

  <rect x="55" y="492" width="320" height="44" rx="7" fill="#ffffff" stroke="#ccc"/>
  <text x="215" y="519" text-anchor="middle" font-size="10.5" font-weight="600" fill="#555">Service operations</text>
  <line x1="379" y1="514" x2="661" y2="514" stroke="#ccc" stroke-width="1.2" stroke-dasharray="3 5"/>
  <rect x="665" y="492" width="320" height="44" rx="7" fill="#ffffff" stroke="#ccc"/>
  <text x="825" y="519" text-anchor="middle" font-size="10.5" font-weight="600" fill="#555">Casos de uso y endpoints</text>

  <!-- Out of scope -->
  <rect x="25" y="562" width="990" height="118" rx="10" fill="#fdf4f2" stroke="#c96a5e" stroke-width="1.3"/>
  <text x="520" y="586" text-anchor="middle" font-size="12" font-weight="700" fill="#8a3b31">Fuera del alcance de este trabajo</text>

  <rect x="50" y="600" width="215" height="34" rx="6" fill="#ffffff" stroke="#e0b5ad"/>
  <text x="157" y="621" text-anchor="middle" font-size="10" fill="#8a3b31">Functional patterns</text>
  <rect x="280" y="600" width="215" height="34" rx="6" fill="#ffffff" stroke="#e0b5ad"/>
  <text x="387" y="621" text-anchor="middle" font-size="10" fill="#8a3b31">Semantic APIs</text>
  <rect x="510" y="600" width="215" height="34" rx="6" fill="#ffffff" stroke="#e0b5ad"/>
  <text x="617" y="621" text-anchor="middle" font-size="10" fill="#8a3b31">Business Object Model</text>
  <rect x="740" y="600" width="250" height="34" rx="6" fill="#ffffff" stroke="#e0b5ad"/>
  <text x="865" y="621" text-anchor="middle" font-size="10" fill="#8a3b31">Catálogo de módulos técnicos</text>

  <text x="520" y="656" text-anchor="middle" font-size="10.5" fill="#8a3b31">Los tres primeros describen negocio concreto que el artefacto no implementa.</text>
  <text x="520" y="670" text-anchor="middle" font-size="10.5" fill="#8a3b31">El cuarto agrupa capacidades técnicas que BIAN deliberadamente no modela, y queda bajo el marco de referencia propio.</text>
</svg>
