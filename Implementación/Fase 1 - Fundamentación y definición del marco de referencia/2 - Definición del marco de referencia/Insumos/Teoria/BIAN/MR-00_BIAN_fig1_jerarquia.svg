<svg width="1000" height="480" viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <text x="500" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#2f2f2f">Figura 1. Jerarquía del Service Landscape</text>
  <text x="500" y="50" text-anchor="middle" font-size="10.5" fill="#888">Cada nivel contiene al siguiente — ejemplo recorrido hasta el nivel elemental</text>

  <!-- Service Landscape -->
  <rect x="40" y="76" width="920" height="304" rx="14" fill="#f4f4f4" stroke="#999" stroke-width="1.3"/>
  <text x="58" y="100" font-size="12.5" font-weight="700" fill="#555">Service Landscape v14.0</text>
  <text x="942" y="100" text-anchor="end" font-size="10" fill="#888">más de 300 Service Domains</text>

  <!-- Business Area -->
  <rect x="68" y="114" width="864" height="252" rx="12" fill="#eef0f7" stroke="#7a86b8" stroke-width="1.3"/>
  <text x="86" y="138" font-size="12" font-weight="700" fill="#414d80">Business Area — Sales and Service</text>
  <text x="914" y="138" text-anchor="end" font-size="10" fill="#6b76a5">1 de 5</text>

  <!-- Business Domain -->
  <rect x="96" y="152" width="808" height="200" rx="10" fill="#efe9f7" stroke="#8a6fb0" stroke-width="1.3"/>
  <text x="114" y="176" font-size="12" font-weight="700" fill="#5b4680">Business Domain — Customer Management</text>
  <text x="886" y="176" text-anchor="end" font-size="10" fill="#7a6a99">1 de 38</text>

  <!-- Service Domain chips -->
  <rect x="114" y="194" width="180" height="62" rx="8" fill="#ffffff" stroke="#2f6f6b" stroke-width="1.3"/>
  <text x="204" y="216" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f4d4a">Customer Relationship</text>
  <text x="204" y="233" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f4d4a">Management</text>
  <text x="204" y="248" text-anchor="middle" font-size="9" fill="#3a7d78">Service Domain</text>

  <rect x="314" y="194" width="180" height="62" rx="8" fill="#f7f7f7" stroke="#bbb"/>
  <text x="404" y="222" text-anchor="middle" font-size="10.5" fill="#666">Customer Agreement</text>
  <text x="404" y="240" text-anchor="middle" font-size="9" fill="#999">Service Domain</text>

  <rect x="514" y="194" width="180" height="62" rx="8" fill="#f7f7f7" stroke="#bbb"/>
  <text x="604" y="222" text-anchor="middle" font-size="10.5" fill="#666">Customer Credit Rating</text>
  <text x="604" y="240" text-anchor="middle" font-size="9" fill="#999">Service Domain</text>

  <rect x="714" y="194" width="180" height="62" rx="8" fill="#f7f7f7" stroke="#bbb"/>
  <text x="804" y="222" text-anchor="middle" font-size="10.5" fill="#666">Customer Consent</text>
  <text x="804" y="240" text-anchor="middle" font-size="9" fill="#999">Service Domain</text>

  <text x="500" y="282" text-anchor="middle" font-size="10.5" fill="#7a6a99">y otros Service Domains dentro del mismo Business Domain</text>

  <!-- elemental note inside -->
  <rect x="114" y="298" width="780" height="40" rx="8" fill="#ffffff" stroke="#c9b8e0"/>
  <text x="504" y="316" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5b4680">El Service Domain es el nivel elemental</text>
  <text x="504" y="331" text-anchor="middle" font-size="10" fill="#7a6a99">Si se descompone más, las partes pierden su contexto de negocio y pasan a ser de naturaleza utilitaria</text>

  <!-- legend -->
  <rect x="40" y="400" width="920" height="56" rx="10" fill="#f5fbfa" stroke="#2f6f6b" stroke-width="1.2"/>
  <text x="500" y="422" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f4d4a">Correspondencia con Domain-Driven Design</text>
  <text x="500" y="440" text-anchor="middle" font-size="10.5" fill="#1f4d4a">Un Service Domain equivale conceptualmente a un bounded context: capacidad discreta, frontera propia, información no solapada</text>
</svg>
