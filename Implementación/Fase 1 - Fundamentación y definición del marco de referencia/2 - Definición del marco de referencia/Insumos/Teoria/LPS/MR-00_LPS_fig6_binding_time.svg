<svg width="1100" height="360" viewBox="0 0 1100 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#999" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="550" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#2f2f2f">Figura 6. Binding time</text>
  <text x="550" y="50" text-anchor="middle" font-size="10.5" fill="#888">Momento del ciclo en que una variante queda resuelta, y su efecto sobre la flexibilidad posterior</text>

  <!-- timeline -->
  <line x1="122" y1="86" x2="1000" y2="86" stroke="#999" stroke-width="1.4" marker-end="url(#arT)"/>
  <circle cx="122" cy="86" r="5" fill="#8a6fb0"/>
  <circle cx="337" cy="86" r="5" fill="#8a6fb0"/>
  <circle cx="552" cy="86" r="5" fill="#7a86b8"/>
  <circle cx="767" cy="86" r="5" fill="#4f8f8a"/>
  <circle cx="962" cy="86" r="5" fill="#2f6f6b"/>

  <!-- stages -->
  <rect x="25" y="106" width="195" height="118" rx="9" fill="#efe9f7" stroke="#8a6fb0" stroke-width="1.3"/>
  <text x="122" y="130" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5b4680">Análisis del dominio</text>
  <text x="122" y="152" text-anchor="middle" font-size="10" fill="#555">La característica se decide</text>
  <text x="122" y="167" text-anchor="middle" font-size="10" fill="#555">al construir la línea</text>
  <text x="122" y="192" text-anchor="middle" font-size="10" font-weight="600" fill="#5b4680">Queda fija para todos</text>
  <text x="122" y="207" text-anchor="middle" font-size="10" fill="#666">los productos</text>

  <rect x="240" y="106" width="195" height="118" rx="9" fill="#efe9f7" stroke="#8a6fb0" stroke-width="1.3"/>
  <text x="337" y="130" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5b4680">Generación</text>
  <text x="337" y="152" text-anchor="middle" font-size="10" fill="#555">Se resuelve al derivar</text>
  <text x="337" y="167" text-anchor="middle" font-size="10" fill="#555">el producto</text>
  <text x="337" y="192" text-anchor="middle" font-size="10" font-weight="600" fill="#5b4680">Queda escrita en el</text>
  <text x="337" y="207" text-anchor="middle" font-size="10" fill="#666">código del producto</text>

  <rect x="455" y="106" width="195" height="118" rx="9" fill="#eef0f7" stroke="#7a86b8" stroke-width="1.3"/>
  <text x="552" y="130" text-anchor="middle" font-size="11.5" font-weight="700" fill="#414d80">Compilación</text>
  <text x="552" y="152" text-anchor="middle" font-size="10" fill="#555">Se resuelve al construir</text>
  <text x="552" y="167" text-anchor="middle" font-size="10" fill="#555">el artefacto ejecutable</text>
  <text x="552" y="192" text-anchor="middle" font-size="10" font-weight="600" fill="#414d80">Cambiarla exige</text>
  <text x="552" y="207" text-anchor="middle" font-size="10" fill="#666">recompilar</text>

  <rect x="670" y="106" width="195" height="118" rx="9" fill="#e8f3f2" stroke="#4f8f8a" stroke-width="1.3"/>
  <text x="767" y="130" text-anchor="middle" font-size="11.5" font-weight="700" fill="#26605c">Empaquetado</text>
  <text x="767" y="152" text-anchor="middle" font-size="10" fill="#555">Se resuelve al preparar</text>
  <text x="767" y="167" text-anchor="middle" font-size="10" fill="#555">el despliegue</text>
  <text x="767" y="192" text-anchor="middle" font-size="10" font-weight="600" fill="#26605c">Cambiarla exige</text>
  <text x="767" y="207" text-anchor="middle" font-size="10" fill="#666">volver a desplegar</text>

  <rect x="885" y="106" width="190" height="118" rx="9" fill="#e0f0ee" stroke="#2f6f6b" stroke-width="1.3"/>
  <text x="980" y="130" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f4d4a">Ejecución</text>
  <text x="980" y="152" text-anchor="middle" font-size="10" fill="#555">Se resuelve mientras el</text>
  <text x="980" y="167" text-anchor="middle" font-size="10" fill="#555">producto está corriendo</text>
  <text x="980" y="192" text-anchor="middle" font-size="10" font-weight="600" fill="#1f4d4a">Cambia por</text>
  <text x="980" y="207" text-anchor="middle" font-size="10" fill="#666">configuración externa</text>

  <!-- gradient annotation -->
  <rect x="25" y="244" width="525" height="40" rx="8" fill="#faf8fd" stroke="#b9a6d4"/>
  <text x="287" y="262" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5b4680">Ligado temprano</text>
  <text x="287" y="277" text-anchor="middle" font-size="10" fill="#6d5a8c">Menos flexible después, pero más simple y verificable</text>

  <rect x="560" y="244" width="515" height="40" rx="8" fill="#f5fbfa" stroke="#7fb3af"/>
  <text x="817" y="262" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f4d4a">Ligado tardío</text>
  <text x="817" y="277" text-anchor="middle" font-size="10" fill="#2f6f6b">Más flexible después, pero exige mecanismos de configuración y validación</text>

  <rect x="25" y="298" width="1050" height="44" rx="8" fill="#fafafa" stroke="#ddd"/>
  <text x="550" y="317" text-anchor="middle" font-size="10.5" font-weight="600" fill="#555">Cada punto de variación debe declarar su binding time</text>
  <text x="550" y="333" text-anchor="middle" font-size="10" fill="#777">De ello depende si la decisión puede revisarse después de derivado el producto, o si exige volver a derivarlo</text>
</svg>
