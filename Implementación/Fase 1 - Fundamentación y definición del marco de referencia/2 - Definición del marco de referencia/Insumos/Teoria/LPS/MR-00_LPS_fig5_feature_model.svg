<svg width="1040" height="480" viewBox="0 0 1040 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <text x="520" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#2f2f2f">Figura 5. Notación de un feature model</text>
  <text x="520" y="50" text-anchor="middle" font-size="10.5" fill="#888">Los cuatro tipos de relación entre una característica y su padre, y las restricciones cruzadas</text>

  <!-- Panel 1: obligatoria -->
  <rect x="20" y="72" width="240" height="262" rx="10" fill="#fafafa" stroke="#ddd"/>
  <text x="140" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#5b4680">Obligatoria</text>
  <rect x="80" y="112" width="120" height="30" rx="6" fill="#efe9f7" stroke="#8a6fb0"/>
  <text x="140" y="132" text-anchor="middle" font-size="10" fill="#5b4680">Padre</text>
  <line x1="140" y1="142" x2="140" y2="182" stroke="#8a6fb0" stroke-width="1.4"/>
  <circle cx="140" cy="162" r="5.5" fill="#8a6fb0" stroke="#8a6fb0"/>
  <rect x="80" y="184" width="120" height="30" rx="6" fill="#ffffff" stroke="#8a6fb0"/>
  <text x="140" y="204" text-anchor="middle" font-size="10" fill="#5b4680">A</text>
  <text x="140" y="248" text-anchor="middle" font-size="10.5" font-weight="600" fill="#555">Círculo relleno</text>
  <text x="140" y="272" text-anchor="middle" font-size="10" fill="#666">Todo producto de la familia</text>
  <text x="140" y="287" text-anchor="middle" font-size="10" fill="#666">incluye esta característica</text>
  <text x="140" y="315" text-anchor="middle" font-size="9.5" font-style="italic" fill="#999">Forma parte de lo común</text>

  <!-- Panel 2: opcional -->
  <rect x="280" y="72" width="240" height="262" rx="10" fill="#fafafa" stroke="#ddd"/>
  <text x="400" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#5b4680">Opcional</text>
  <rect x="340" y="112" width="120" height="30" rx="6" fill="#efe9f7" stroke="#8a6fb0"/>
  <text x="400" y="132" text-anchor="middle" font-size="10" fill="#5b4680">Padre</text>
  <line x1="400" y1="142" x2="400" y2="182" stroke="#8a6fb0" stroke-width="1.4"/>
  <circle cx="400" cy="162" r="5.5" fill="#ffffff" stroke="#8a6fb0" stroke-width="1.5"/>
  <rect x="340" y="184" width="120" height="30" rx="6" fill="#ffffff" stroke="#8a6fb0"/>
  <text x="400" y="204" text-anchor="middle" font-size="10" fill="#5b4680">B</text>
  <text x="400" y="248" text-anchor="middle" font-size="10.5" font-weight="600" fill="#555">Círculo vacío</text>
  <text x="400" y="272" text-anchor="middle" font-size="10" fill="#666">El producto puede incluirla</text>
  <text x="400" y="287" text-anchor="middle" font-size="10" fill="#666">o no incluirla</text>
  <text x="400" y="315" text-anchor="middle" font-size="9.5" font-style="italic" fill="#999">Punto de variación simple</text>

  <!-- Panel 3: alternativa -->
  <rect x="540" y="72" width="240" height="262" rx="10" fill="#fafafa" stroke="#ddd"/>
  <text x="660" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#5b4680">Alternativa</text>
  <rect x="600" y="112" width="120" height="30" rx="6" fill="#efe9f7" stroke="#8a6fb0"/>
  <text x="660" y="132" text-anchor="middle" font-size="10" fill="#5b4680">Padre</text>
  <line x1="660" y1="142" x2="615" y2="182" stroke="#8a6fb0" stroke-width="1.4"/>
  <line x1="660" y1="142" x2="705" y2="182" stroke="#8a6fb0" stroke-width="1.4"/>
  <path d="M 642 161 A 24 24 0 0 0 678 161" fill="#ffffff" stroke="#8a6fb0" stroke-width="1.5"/>
  <rect x="575" y="184" width="80" height="30" rx="6" fill="#ffffff" stroke="#8a6fb0"/>
  <text x="615" y="204" text-anchor="middle" font-size="10" fill="#5b4680">C1</text>
  <rect x="665" y="184" width="80" height="30" rx="6" fill="#ffffff" stroke="#8a6fb0"/>
  <text x="705" y="204" text-anchor="middle" font-size="10" fill="#5b4680">C2</text>
  <text x="660" y="248" text-anchor="middle" font-size="10.5" font-weight="600" fill="#555">Arco vacío</text>
  <text x="660" y="272" text-anchor="middle" font-size="10" fill="#666">El producto elige</text>
  <text x="660" y="287" text-anchor="middle" font-size="10" fill="#666">exactamente una</text>
  <text x="660" y="315" text-anchor="middle" font-size="9.5" font-style="italic" fill="#999">Opciones mutuamente excluyentes</text>

  <!-- Panel 4: or -->
  <rect x="800" y="72" width="240" height="262" rx="10" fill="#fafafa" stroke="#ddd"/>
  <text x="920" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#5b4680">Or</text>
  <rect x="860" y="112" width="120" height="30" rx="6" fill="#efe9f7" stroke="#8a6fb0"/>
  <text x="920" y="132" text-anchor="middle" font-size="10" fill="#5b4680">Padre</text>
  <line x1="920" y1="142" x2="875" y2="182" stroke="#8a6fb0" stroke-width="1.4"/>
  <line x1="920" y1="142" x2="965" y2="182" stroke="#8a6fb0" stroke-width="1.4"/>
  <path d="M 902 161 A 24 24 0 0 0 938 161" fill="#8a6fb0" stroke="#8a6fb0" stroke-width="1.5"/>
  <rect x="835" y="184" width="80" height="30" rx="6" fill="#ffffff" stroke="#8a6fb0"/>
  <text x="875" y="204" text-anchor="middle" font-size="10" fill="#5b4680">D1</text>
  <rect x="925" y="184" width="80" height="30" rx="6" fill="#ffffff" stroke="#8a6fb0"/>
  <text x="965" y="204" text-anchor="middle" font-size="10" fill="#5b4680">D2</text>
  <text x="920" y="248" text-anchor="middle" font-size="10.5" font-weight="600" fill="#555">Arco relleno</text>
  <text x="920" y="272" text-anchor="middle" font-size="10" fill="#666">El producto elige</text>
  <text x="920" y="287" text-anchor="middle" font-size="10" fill="#666">una o más</text>
  <text x="920" y="315" text-anchor="middle" font-size="9.5" font-style="italic" fill="#999">Selección múltiple permitida</text>

  <!-- cross-tree constraints -->
  <rect x="20" y="352" width="1020" height="104" rx="10" fill="#f5fbfa" stroke="#2f6f6b" stroke-width="1.3"/>
  <text x="530" y="376" text-anchor="middle" font-size="12" font-weight="700" fill="#1f4d4a">Restricciones cruzadas</text>
  <text x="530" y="396" text-anchor="middle" font-size="10.5" fill="#1f4d4a">Relaciones entre características que no son parientes en el árbol, y que el árbol por sí solo no puede expresar</text>

  <rect x="180" y="408" width="300" height="34" rx="6" fill="#ffffff" stroke="#7fb3af"/>
  <text x="330" y="429" text-anchor="middle" font-size="10.5" fill="#1f4d4a">A requiere B — si se elige A, B es obligatoria</text>

  <rect x="560" y="408" width="300" height="34" rx="6" fill="#ffffff" stroke="#7fb3af"/>
  <text x="710" y="429" text-anchor="middle" font-size="10.5" fill="#1f4d4a">C excluye D — no pueden coexistir</text>
</svg>
