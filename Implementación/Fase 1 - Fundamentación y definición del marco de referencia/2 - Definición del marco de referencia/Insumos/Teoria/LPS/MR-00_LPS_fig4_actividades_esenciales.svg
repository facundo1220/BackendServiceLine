<svg width="900" height="560" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <text x="450" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#2f2f2f">Figura 4. Las tres actividades esenciales</text>
  <text x="450" y="48" text-anchor="middle" font-size="10.5" fill="#888">Elaboración propia a partir de Clements y Northrop (2001)</text>

  <!-- rings -->
  <circle cx="330" cy="200" r="112" fill="none" stroke="#8a6fb0" stroke-width="22" opacity="0.9"/>
  <circle cx="570" cy="200" r="112" fill="none" stroke="#2f6f6b" stroke-width="22" opacity="0.9"/>
  <circle cx="450" cy="368" r="112" fill="none" stroke="#c96a5e" stroke-width="22" opacity="0.9"/>

  <!-- inner white fills for text -->
  <circle cx="330" cy="200" r="98" fill="#ffffff"/>
  <circle cx="570" cy="200" r="98" fill="#ffffff"/>
  <circle cx="450" cy="368" r="98" fill="#ffffff"/>

  <!-- texts -->
  <text x="330" y="180" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5b4680">Desarrollo de</text>
  <text x="330" y="198" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5b4680">core assets</text>
  <text x="330" y="222" text-anchor="middle" font-size="10" fill="#7a6a99">Construir y mantener</text>
  <text x="330" y="237" text-anchor="middle" font-size="10" fill="#7a6a99">los activos reutilizables</text>

  <text x="570" y="180" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f4d4a">Desarrollo de</text>
  <text x="570" y="198" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f4d4a">productos</text>
  <text x="570" y="222" text-anchor="middle" font-size="10" fill="#2f6f6b">Derivar productos</text>
  <text x="570" y="237" text-anchor="middle" font-size="10" fill="#2f6f6b">a partir de los activos</text>

  <text x="450" y="356" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8a3b31">Gestión</text>
  <text x="450" y="380" text-anchor="middle" font-size="10" fill="#a15b50">Decidir el alcance, asignar</text>
  <text x="450" y="395" text-anchor="middle" font-size="10" fill="#a15b50">responsables y sostener</text>
  <text x="450" y="410" text-anchor="middle" font-size="10" fill="#a15b50">la línea en el tiempo</text>

  <!-- note -->
  <rect x="60" y="500" width="780" height="46" rx="9" fill="#fafafa" stroke="#ddd"/>
  <text x="450" y="519" text-anchor="middle" font-size="10.5" fill="#666">Las tres ocurren en paralelo y se retroalimentan. Sin gestión, el desarrollo de activos pierde alcance y dirección.</text>
  <text x="450" y="535" text-anchor="middle" font-size="10.5" fill="#666">Sin desarrollo de producto, los activos no se validan contra un caso real. Sin activos, cada producto se construye desde cero.</text>
</svg>
