<svg width="1120" height="660" viewBox="0 0 1120 660" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#666" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="560" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#2f2f2f">Figura 3. Modelo de referencia de cuatro cuadrantes</text>
  <text x="560" y="48" text-anchor="middle" font-size="10.5" fill="#888">Elaboración propia a partir de Apel, Batory, Kästner y Saake (2013)</text>

  <text x="325" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#555">Espacio del problema</text>
  <text x="820" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#555">Espacio de la solución</text>

  <line x1="578" y1="90" x2="578" y2="600" stroke="#bbb" stroke-width="1.2" stroke-dasharray="7 6"/>
  <line x1="70" y1="348" x2="1080" y2="348" stroke="#bbb" stroke-width="1.2" stroke-dasharray="7 6"/>

  <text x="28" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#5b4680" transform="rotate(-90 28 215)">Ingeniería de dominio</text>
  <text x="28" y="478" text-anchor="middle" font-size="13" font-weight="700" fill="#1f4d4a" transform="rotate(-90 28 478)">Ingeniería de aplicación</text>

  <!-- Q1 -->
  <rect x="120" y="94" width="410" height="228" rx="10" fill="#faf8fd" stroke="#8a6fb0" stroke-width="1.4"/>
  <text x="325" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#5b4680">Análisis del dominio</text>
  <line x1="148" y1="132" x2="502" y2="132" stroke="#d8cfe6"/>
  <text x="148" y="154" font-size="10.5" fill="#555">Entra el conocimiento del dominio</text>
  <text x="148" y="180" font-size="10.5" font-weight="600" fill="#6d5a8c">Produce</text>
  <text x="148" y="198" font-size="10.5" fill="#555">• El alcance de la familia de productos</text>
  <text x="148" y="216" font-size="10.5" fill="#555">• El feature model: qué características existen</text>
  <text x="148" y="234" font-size="10.5" fill="#555">  y qué reglas las relacionan</text>
  <text x="148" y="252" font-size="10.5" fill="#555">• El binding time de cada punto de variación</text>
  <rect x="148" y="270" width="354" height="34" rx="6" fill="#efe9f7"/>
  <text x="325" y="291" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5b4680">Delimitar el alcance y modelar la variabilidad es una sola actividad</text>

  <!-- Q2 -->
  <rect x="626" y="94" width="410" height="228" rx="10" fill="#faf8fd" stroke="#8a6fb0" stroke-width="1.4"/>
  <text x="831" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#5b4680">Implementación del dominio</text>
  <line x1="654" y1="132" x2="1008" y2="132" stroke="#d8cfe6"/>
  <text x="654" y="154" font-size="10.5" font-weight="600" fill="#6d5a8c">Contiene</text>
  <text x="654" y="172" font-size="10.5" fill="#555">• Un activo por cada característica del modelo</text>
  <text x="654" y="190" font-size="10.5" fill="#555">• La arquitectura común que los relaciona</text>
  <text x="654" y="208" font-size="10.5" fill="#555">• Los contratos entre activos</text>
  <text x="654" y="234" font-size="10.5" font-weight="600" fill="#6d5a8c">Naturaleza</text>
  <text x="654" y="252" font-size="10.5" fill="#555">Código, modelos y documentación reutilizables</text>
  <rect x="654" y="270" width="354" height="34" rx="6" fill="#efe9f7"/>
  <text x="831" y="291" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5b4680">Se construye una sola vez, no por cada producto</text>

  <!-- Q3 -->
  <rect x="120" y="374" width="410" height="212" rx="10" fill="#f5fbfa" stroke="#2f6f6b" stroke-width="1.4"/>
  <text x="325" y="400" text-anchor="middle" font-size="13" font-weight="700" fill="#1f4d4a">Análisis de requerimientos</text>
  <line x1="148" y1="412" x2="502" y2="412" stroke="#c9e3e0"/>
  <text x="148" y="434" font-size="10.5" fill="#555">Entran las necesidades de un producto concreto</text>
  <text x="148" y="460" font-size="10.5" font-weight="600" fill="#2f6f6b">Actividad</text>
  <text x="148" y="478" font-size="10.5" fill="#555">Se configura el producto marcando, sobre el mismo</text>
  <text x="148" y="496" font-size="10.5" fill="#555">feature model, qué características incluye</text>
  <text x="148" y="514" font-size="10.5" fill="#555">Debe respetar las restricciones declaradas</text>
  <rect x="148" y="532" width="354" height="34" rx="6" fill="#e0f0ee"/>
  <text x="325" y="553" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f4d4a">El árbol es el mismo del análisis del dominio</text>

  <!-- Q4 -->
  <rect x="626" y="374" width="410" height="212" rx="10" fill="#f5fbfa" stroke="#2f6f6b" stroke-width="1.4"/>
  <text x="831" y="400" text-anchor="middle" font-size="13" font-weight="700" fill="#1f4d4a">Derivación del producto</text>
  <line x1="654" y1="412" x2="1008" y2="412" stroke="#c9e3e0"/>
  <text x="654" y="434" font-size="10.5" font-weight="600" fill="#2f6f6b">Mecanismo</text>
  <text x="654" y="452" font-size="10.5" fill="#555">Ensambla los activos correspondientes a las</text>
  <text x="654" y="470" font-size="10.5" fill="#555">características seleccionadas</text>
  <text x="654" y="496" font-size="10.5" font-weight="600" fill="#2f6f6b">Salida</text>
  <text x="654" y="514" font-size="10.5" fill="#555">Un producto con exactamente esas características</text>
  <rect x="654" y="532" width="354" height="34" rx="6" fill="#e0f0ee"/>
  <text x="831" y="553" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f4d4a">Incluye validación y verificación</text>

  <!-- flows -->
  <line x1="544" y1="200" x2="622" y2="200" stroke="#666" stroke-width="1.4" marker-end="url(#a3)"/>
  <rect x="548" y="176" width="60" height="18" fill="#ffffff"/>
  <text x="578" y="189" text-anchor="middle" font-size="10.5" font-weight="600" fill="#555">Mapeo</text>

  <line x1="420" y1="326" x2="420" y2="370" stroke="#666" stroke-width="1.4" marker-end="url(#a3)"/>
  <rect x="428" y="338" width="90" height="18" fill="#ffffff"/>
  <text x="432" y="351" font-size="10.5" font-weight="600" fill="#555">Características</text>

  <line x1="240" y1="370" x2="240" y2="326" stroke="#666" stroke-width="1.4" marker-end="url(#a3)"/>
  <rect x="110" y="338" width="124" height="18" fill="#ffffff"/>
  <text x="232" y="351" text-anchor="end" font-size="10.5" font-weight="600" fill="#555">Nuevos requerimientos</text>

  <line x1="900" y1="326" x2="900" y2="370" stroke="#666" stroke-width="1.4" marker-end="url(#a3)"/>
  <rect x="908" y="338" width="102" height="18" fill="#ffffff"/>
  <text x="912" y="351" font-size="10.5" font-weight="600" fill="#555">Activos comunes</text>

  <line x1="544" y1="480" x2="622" y2="480" stroke="#666" stroke-width="1.4" marker-end="url(#a3)"/>
  <rect x="536" y="456" width="86" height="18" fill="#ffffff"/>
  <text x="579" y="469" text-anchor="middle" font-size="10.5" font-weight="600" fill="#555">Selección</text>

  <!-- product output -->
  <line x1="1040" y1="480" x2="1092" y2="480" stroke="#666" stroke-width="1.4" marker-end="url(#a3)"/>
  <text x="1066" y="468" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f4d4a">Producto</text>

  <!-- note -->
  <rect x="70" y="608" width="1010" height="38" rx="8" fill="#fafafa" stroke="#ddd"/>
  <text x="575" y="632" text-anchor="middle" font-size="10.5" fill="#666">El flujo de selección solo puede automatizarse si existe un feature model formal del que seleccionar</text>
</svg>
