<svg width="1060" height="470" viewBox="0 0 1060 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#777" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="530" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#2f2f2f">Figura 2. Los dos ciclos de una línea de producto</text>
  <text x="530" y="48" text-anchor="middle" font-size="10.5" fill="#888">Elaboración propia a partir de Pohl, Böckle y van der Linden (2005)</text>

  <!-- Application engineering -->
  <rect x="300" y="86" width="420" height="76" rx="12" fill="#e0f0ee" stroke="#2f6f6b" stroke-width="1.6"/>
  <text x="510" y="116" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f4d4a">Ingeniería de aplicación</text>
  <text x="510" y="138" text-anchor="middle" font-size="10.5" fill="#2f6f6b">Deriva un producto concreto a partir de los activos</text>

  <!-- Assets cylinder -->
  <ellipse cx="450" cy="214" rx="70" ry="16" fill="#f4efd9" stroke="#c99a3f" stroke-width="1.4"/>
  <rect x="380" y="214" width="140" height="62" fill="#f4efd9" stroke="#c99a3f" stroke-width="1.4"/>
  <line x1="380" y1="214" x2="380" y2="276" stroke="#c99a3f" stroke-width="1.4"/>
  <line x1="520" y1="214" x2="520" y2="276" stroke="#c99a3f" stroke-width="1.4"/>
  <ellipse cx="450" cy="276" rx="70" ry="16" fill="#f4efd9" stroke="#c99a3f" stroke-width="1.4"/>
  <text x="450" y="250" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a5a1e">Core assets</text>

  <!-- Domain engineering -->
  <rect x="300" y="330" width="420" height="76" rx="12" fill="#efe9f7" stroke="#8a6fb0" stroke-width="1.6"/>
  <text x="510" y="360" text-anchor="middle" font-size="13.5" font-weight="700" fill="#5b4680">Ingeniería de dominio</text>
  <text x="510" y="382" text-anchor="middle" font-size="10.5" fill="#7a6a99">Produce y mantiene los activos reutilizables</text>

  <!-- vertical flows -->
  <line x1="420" y1="328" x2="420" y2="296" stroke="#777" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="410" y="315" text-anchor="end" font-size="10" font-style="italic" fill="#777">alimenta</text>

  <line x1="420" y1="196" x2="420" y2="164" stroke="#777" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="410" y="184" text-anchor="end" font-size="10" font-style="italic" fill="#777">consume</text>

  <!-- feedback -->
  <line x1="630" y1="164" x2="630" y2="328" stroke="#c96a5e" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a2)"/>
  <rect x="644" y="234" width="128" height="22" fill="#ffffff"/>
  <text x="648" y="249" font-size="10" font-weight="600" fill="#8a3b31">nuevos requerimientos</text>

  <!-- inputs -->
  <line x1="70" y1="124" x2="296" y2="124" stroke="#777" stroke-width="1.4" marker-end="url(#a2)"/>
  <text x="180" y="114" text-anchor="middle" font-size="10.5" font-weight="600" fill="#555">Requisitos de un producto</text>

  <line x1="70" y1="368" x2="296" y2="368" stroke="#777" stroke-width="1.4" marker-end="url(#a2)"/>
  <text x="180" y="358" text-anchor="middle" font-size="10.5" font-weight="600" fill="#555">Conocimiento del dominio</text>

  <!-- outputs -->
  <line x1="724" y1="124" x2="960" y2="124" stroke="#777" stroke-width="1.4" marker-end="url(#a2)"/>
  <text x="842" y="114" text-anchor="middle" font-size="10.5" font-weight="600" fill="#555">Producto</text>

  <line x1="724" y1="368" x2="960" y2="368" stroke="#777" stroke-width="1.4" marker-end="url(#a2)"/>
  <text x="842" y="358" text-anchor="middle" font-size="10.5" font-weight="600" fill="#555">Modelo de variabilidad</text>

  <!-- note -->
  <rect x="70" y="424" width="920" height="34" rx="8" fill="#fafafa" stroke="#ddd"/>
  <text x="530" y="446" text-anchor="middle" font-size="10.5" fill="#666">La relación no es de un solo sentido: la ingeniería de aplicación consume los activos, pero también genera necesidades que el dominio debe incorporar</text>
</svg>
