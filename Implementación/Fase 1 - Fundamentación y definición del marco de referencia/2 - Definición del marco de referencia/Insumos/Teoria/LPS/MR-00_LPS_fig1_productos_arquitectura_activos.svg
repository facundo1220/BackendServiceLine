<svg width="1000" height="430" viewBox="0 0 1000 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#999" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="500" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#2f2f2f">Figura 1. Productos, dominio, arquitectura y activos</text>
  <text x="500" y="48" text-anchor="middle" font-size="10.5" fill="#888">Elaboración propia a partir de Clements y Northrop (2001)</text>

  <!-- products cluster -->
  <circle cx="120" cy="150" r="46" fill="#414d80" opacity="0.85"/>
  <circle cx="172" cy="180" r="44" fill="#7a86b8" opacity="0.85"/>
  <circle cx="122" cy="218" r="42" fill="#8a3b31" opacity="0.85"/>
  <text x="146" y="288" text-anchor="middle" font-size="12" font-weight="700" fill="#444">Productos de la familia</text>

  <!-- chain boxes -->
  <rect x="360" y="92" width="280" height="56" rx="9" fill="#eef0f7" stroke="#7a86b8" stroke-width="1.4"/>
  <text x="500" y="118" text-anchor="middle" font-size="12.5" font-weight="700" fill="#414d80">Dominio de negocio</text>
  <text x="500" y="136" text-anchor="middle" font-size="10" fill="#6b76a5">Define el alcance de la familia</text>

  <rect x="360" y="178" width="280" height="56" rx="9" fill="#efe9f7" stroke="#8a6fb0" stroke-width="1.4"/>
  <text x="500" y="204" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5b4680">Arquitectura común</text>
  <text x="500" y="222" text-anchor="middle" font-size="10" fill="#7a6a99">Estructura compartida por todos</text>

  <rect x="360" y="264" width="280" height="56" rx="9" fill="#e0f0ee" stroke="#2f6f6b" stroke-width="1.4"/>
  <text x="500" y="290" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f4d4a">Componentes y servicios</text>
  <text x="500" y="308" text-anchor="middle" font-size="10" fill="#2f6f6b">Piezas con que se construye</text>

  <!-- relation arrows from cluster -->
  <line x1="200" y1="140" x2="356" y2="118" stroke="#999" stroke-width="1.3" marker-end="url(#a1)"/>
  <text x="278" y="116" text-anchor="middle" font-size="10.5" font-style="italic" fill="#666">pertenecen a</text>

  <line x1="216" y1="192" x2="356" y2="204" stroke="#999" stroke-width="1.3" marker-end="url(#a1)"/>
  <text x="286" y="188" text-anchor="middle" font-size="10.5" font-style="italic" fill="#666">comparten una</text>

  <line x1="164" y1="250" x2="356" y2="292" stroke="#999" stroke-width="1.3" marker-end="url(#a1)"/>
  <text x="262" y="284" text-anchor="middle" font-size="10.5" font-style="italic" fill="#666">se construyen con</text>

  <!-- vertical chain relations -->
  <line x1="500" y1="150" x2="500" y2="174" stroke="#aaa" stroke-width="1.2" marker-end="url(#a1)"/>
  <text x="514" y="167" font-size="9.5" font-style="italic" fill="#888">se satisface con</text>
  <line x1="500" y1="236" x2="500" y2="260" stroke="#aaa" stroke-width="1.2" marker-end="url(#a1)"/>
  <text x="514" y="253" font-size="9.5" font-style="italic" fill="#888">se estructura con</text>

  <!-- core assets -->
  <rect x="720" y="92" width="230" height="228" rx="10" fill="#fafafa" stroke="#999" stroke-width="1.3"/>
  <text x="835" y="118" text-anchor="middle" font-size="12.5" font-weight="700" fill="#555">Core assets</text>
  <rect x="750" y="134" width="170" height="30" rx="5" fill="#ffffff" stroke="#ccc"/>
  <text x="835" y="154" text-anchor="middle" font-size="10" fill="#666">Arquitectura</text>
  <rect x="750" y="172" width="170" height="30" rx="5" fill="#ffffff" stroke="#ccc"/>
  <text x="835" y="192" text-anchor="middle" font-size="10" fill="#666">Componentes</text>
  <rect x="750" y="210" width="170" height="30" rx="5" fill="#ffffff" stroke="#ccc"/>
  <text x="835" y="230" text-anchor="middle" font-size="10" fill="#666">Contratos y modelos</text>
  <rect x="750" y="248" width="170" height="30" rx="5" fill="#ffffff" stroke="#ccc"/>
  <text x="835" y="268" text-anchor="middle" font-size="10" fill="#666">Documentación</text>
  <text x="835" y="302" text-anchor="middle" font-size="9.5" font-style="italic" fill="#999">No solo código</text>

  <line x1="644" y1="206" x2="716" y2="206" stroke="#999" stroke-width="1.3" marker-end="url(#a1)"/>

  <!-- bottom band -->
  <rect x="40" y="346" width="920" height="60" rx="10" fill="#f5fbfa" stroke="#2f6f6b" stroke-width="1.3"/>
  <text x="500" y="370" text-anchor="middle" font-size="12" font-weight="700" fill="#1f4d4a">Definición operativa de una línea de producto</text>
  <text x="500" y="390" text-anchor="middle" font-size="10.5" fill="#1f4d4a">Toma ventaja económica de lo común entre productos, y acota su variación</text>
</svg>
